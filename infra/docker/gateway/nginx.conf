# Local stand-in for the hosted Supabase gateway: routing plus CORS for the dev origin only.
map $http_origin $cors_origin {
  default "";
  "http://localhost:5173" $http_origin;
  "http://127.0.0.1:5173" $http_origin;
  "http://localhost:4173" $http_origin;
}

server {
  listen 80;

  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    # Auth sends its own wildcard header, and browsers reject a response with two.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    proxy_pass http://auth:9999/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
