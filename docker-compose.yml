# Local development stack (blueprint section 12): Postgres, Redis, Supabase Auth, mail sink.
# Non-default host ports avoid clashes with other local services. Run `pnpm setup:env` first.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup:env}
      POSTGRES_DB: lifeos
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?run pnpm setup:env}
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-auth.sh:/docker-entrypoint-initdb.d/10-init-auth.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    # BullMQ requires noeviction so queued jobs are never dropped under memory pressure.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:58025:8025"]

  auth:
    image: supabase/auth:v2.197.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@postgres:5432/auth?search_path=auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/**,http://127.0.0.1:5173/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:?run pnpm setup:env}
      GOTRUE_JWT_KEYS: ${AUTH_JWT_KEYS:?run pnpm setup:env}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@lifeos.local
      GOTRUE_SMTP_SENDER_NAME: LifeOS
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Serves Auth under /auth/v1, the same URL shape as hosted Supabase, so supabase-js needs no changes.
  gateway:
    image: nginx:1.29-alpine
    depends_on:
      auth: { condition: service_healthy }
    ports: ["127.0.0.1:54321:80"]
    volumes:
      - ./infra/docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
